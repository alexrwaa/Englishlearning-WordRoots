name: Build portable Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 portable ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Build desktop binary
        working-directory: src-tauri
        run: cargo build --release --locked

      - name: Assemble portable folder
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Smoke test the packaged app
        shell: pwsh
        continue-on-error: true
        run: ./scripts/smoke-test.ps1

      - name: Write checksums
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist-portable/*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -Encoding utf8 dist-portable/WordRoots-SHA256.txt
          Get-Content dist-portable/WordRoots-SHA256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordRoots-Portable-Windows-x64
          path: |
            dist-portable/WordRoots-Portable-Windows-x64.zip
            dist-portable/WordRoots-SHA256.txt

      - name: Publish release
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($pkg.version)"
          $notes = "docs/Release-Notes.md"
          if (-not (Test-Path $notes)) {
            "WordRoots $tag" | Out-File -Encoding utf8 $notes
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "WordRoots $tag" --notes-file $notes --target $env:GITHUB_SHA
          } else {
            gh release edit $tag --notes-file $notes
          }
          gh release upload $tag dist-portable/WordRoots-Portable-Windows-x64.zip dist-portable/WordRoots-SHA256.txt --clobber
          gh release view $tag --json url -q .url
