name: Build portable Windows app

# Two modes, deliberately different:
#   * push to main / workflow_dispatch -> build, smoke test, upload artifact.
#     No release is created: a release must correspond to a tag.
#   * push of a vX.Y.Z tag -> the same checks, then an *immutable* release.
#     The tag must match package.json and an existing release is a hard failure
#     (releases are never overwritten, so what was tested is what shipped).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x64 portable ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      # Blocking: a broken backend must stop the pipeline before packaging.
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --all-targets

      # `custom-protocol` is what makes the binary serve the bundled frontend
      # instead of the dev server. Missing it produced the 0.1.0 "localhost
      # refused to connect" window, so it is explicit here rather than implicit.
      - name: Build desktop binary
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol

      - name: Assemble portable folder
        shell: pwsh
        run: ./scripts/package-portable.ps1

      # Release gate. No continue-on-error: the smoke test proves the packaged
      # app really renders and really answers a question inside WebView2 under
      # eight proxy/path conditions. A database file alone is not evidence.
      - name: Smoke test the packaged app
        shell: pwsh
        run: ./scripts/smoke-test.ps1

      - name: Write checksums
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist-portable/*.zip | Select-Object -First 1
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Out-File -Encoding utf8 dist-portable/WordRoots-SHA256.txt
          Get-Content dist-portable/WordRoots-SHA256.txt

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordRoots-Portable-Windows-x64
          path: |
            dist-portable/WordRoots-Portable-Windows-x64.zip
            dist-portable/WordRoots-SHA256.txt
            dist-portable/smoke-report.md

      # On failure the ZIP itself is uploaded: without it a red run can only be
      # debugged on a Windows machine, which defeats the point of the gate.
      - name: Upload build for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WordRoots-failed-build
          path: dist-portable/WordRoots-Portable-Windows-x64.zip
          if-no-files-found: warn

      # The report is the release evidence; the per-case logs are what makes a
      # red run diagnosable without re-running Windows.
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WordRoots-smoke-evidence
          path: |
            dist-portable/smoke-report.md
            dist-portable/smoke-logs/**
            dist-portable/release-evidence.json
          if-no-files-found: warn

      - name: Publish immutable release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($pkg.version)"

          if ($env:GITHUB_REF_NAME -ne $tag) {
            throw "tag '$($env:GITHUB_REF_NAME)' does not match package.json version '$tag'"
          }
          if (-not (Test-Path 'docs/Release-Notes.md')) {
            throw 'docs/Release-Notes.md is required for a release'
          }

          # Immutable: never patch an existing release, always fail instead.
          $exists = $false
          try {
            gh release view $tag --json tagName *> $null
            $exists = ($LASTEXITCODE -eq 0)
          } catch {
            $exists = $false
          }
          if ($exists) {
            throw "release $tag already exists; releases are immutable and are not overwritten"
          }

          gh release create $tag --target $env:GITHUB_SHA --title "WordRoots $tag" --notes-file docs/Release-Notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create $tag failed" }

          gh release upload $tag dist-portable/WordRoots-Portable-Windows-x64.zip dist-portable/WordRoots-SHA256.txt
          if ($LASTEXITCODE -ne 0) { throw "gh release upload $tag failed" }

          # Evidence: what the release actually contains, on the record.
          gh release view $tag --json assets,url | Tee-Object -FilePath dist-portable/release-evidence.json
          Get-Content dist-portable/release-evidence.json
