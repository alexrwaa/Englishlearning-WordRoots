name: CI

# Fast feedback on every push/PR. Packaging (binary + real-launch smoke test)
# lives in portable-windows.yml and is not duplicated here: the Windows-only
# PowerShell path assertions cannot run on ubuntu, and building the portable
# folder twice would only double the cost.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck · lint · unit tests · content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Course content validation
        run: npm run validate:content
      - name: Course index is current
        run: npm run validate:course-index
      - name: No placeholder pages
        run: npm run check:stubs
      - name: Frontend production build
        run: npm run build

  rust:
    name: Rust backend checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Provide frontend dist for tauri context
        shell: bash
        run: mkdir -p dist && printf '<!doctype html><title>ci</title>' > dist/index.html
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
      # Blocking: backend tests are cheap and catch DB/command regressions that
      # the portable build would otherwise ship.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets
      # Advisory on purpose: clippy churn must not block a release, but the
      # warnings stay visible in the job log for the next cleanup pass. The
      # blocking gates are cargo check, cargo test and the packaging smoke test.
      - name: cargo clippy (advisory)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        continue-on-error: true
