name: CI

# Fast feedback on every push/PR. Packaging (binary + real-launch smoke test)
# lives in portable-windows.yml and is not duplicated here: the Windows-only
# PowerShell path assertions cannot run on ubuntu, and building the portable
# folder twice would only double the cost.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by portable-windows.yml so a tag runs *these* checks on *its own*
  # commit. Before 0.9.1 the release trusted main's green CI, and v0.9.0 shipped
  # a tag whose identical SHA had failed here on a stale lesson bundle.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck · lint · unit tests · content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Course content validation
        run: npm run validate:content
      - name: Course index is current
        run: npm run validate:course-index
      - name: No placeholder pages
        run: npm run check:stubs
      # The app imports one bundled lesson file (230+ sources). A stale bundle
      # ships old lessons silently, so CI checks it before the build rewrites it.
      - name: Lesson bundle is current
        run: node scripts/bundle-lessons.mjs --check
      - name: Lesson time audit
        run: npm run audit:time
      # Word status is derived, never hand-edited: a drifting status block means
      # someone changed the lexicon without re-deriving, which is how "verified"
      # stopped meaning anything in 0.7.0.
      - name: Word status is current
        run: node scripts/migrate-word-status.mjs --check
      # The status doc used to carry hand-typed counts that drifted within a day.
      - name: Word status doc is current
        run: node scripts/word-status-report.mjs --check
      - name: Review evidence audit
        run: node scripts/audit-reviews.mjs --check
      - name: Licence and provenance
        run: node scripts/check-license.mjs
      # A single unbalanced here-string in package-portable.ps1 broke the 0.5.0
      # portable build without any readable error. Parsing costs a second.
      - name: Script syntax check
        shell: pwsh
        run: ./scripts/check-ps1.ps1
      - name: Frontend production build
        run: npm run build

  rust:
    name: Rust backend checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Provide frontend dist for tauri context
        shell: bash
        run: mkdir -p dist && printf '<!doctype html><title>ci</title>' > dist/index.html
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets
      # Blocking: backend tests are cheap and catch DB/command regressions that
      # the portable build would otherwise ship.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-targets
      # Advisory on purpose: clippy churn must not block a release, but the
      # warnings stay visible in the job log for the next cleanup pass. The
      # blocking gates are cargo check, cargo test and the packaging smoke test.
      - name: cargo clippy (advisory)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        continue-on-error: true
