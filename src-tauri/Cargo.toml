[package]
name = "wordroots"
version = "0.6.0"
description = "WordRoots portable English morphology learning app"
authors = ["WordRoots contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Tauri serves the bundled frontend from the `tauri.localhost` custom protocol
# only when this feature is on. Without it `tauri::is_dev()` stays true and the
# binary navigates to `devUrl` (the Vite server) — which is exactly the
# "localhost refused to connect" window users saw in 0.1.0. `tauri build` adds
# this automatically; plain `cargo build --release` does not, so CI passes it
# explicitly.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
